name: Mabroo

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Check out your repository code so the runner can see it
    - name: Checkout code
      uses: actions/checkout@v4

    # Step 2: Set up Java JDK 21 (matching your pom.xml compiler settings)
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    # Step 3: Run your JUnit tests using Maven
    - name: Run Tests with Maven
      run: mvn clean test
